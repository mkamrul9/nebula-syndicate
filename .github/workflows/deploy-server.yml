# File: .github/workflows/deploy-server.yml
name: Deploy Nebula Server to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'Nebula.Server/**'
      - 'Nebula.Shared/**'
      - 'Nebula.Domain/**'

env:
  REGISTRY_NAME: nebularegistry
  APP_NAME: nebula-game-server
  RESOURCE_GROUP: NebulaSyndicate-RG

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.REGISTRY_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Docker image
      run: |
        # Tag the image with the GitHub run ID for easy rollback
        IMAGE_TAG=${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ github.run_id }}
        
        docker build -f Nebula.Server/Dockerfile -t $IMAGE_TAG .
        docker push $IMAGE_TAG

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      uses: azure/CLI@v1
      with:
        inlineScript: |
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ github.run_id }}
